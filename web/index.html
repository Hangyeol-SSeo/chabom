<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>차봄 · 내 차를 고르는 공간</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <section id="authScreen" class="auth-screen" aria-live="polite">
    <div class="auth-card">
      <span class="brand auth-brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>차봄</span>
      <div id="authBody"><p class="subtitle">불러오는 중…</p></div>
    </div>
  </section>
  <div class="app-shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#garage" aria-label="차봄 차량 보관함"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>차봄<span class="brand-caption">내 차를 고르는 공간</span></a>
      <button class="mobile-logout button quiet small" data-action="logout">로그아웃</button>
      <nav aria-label="주 메뉴">
        <a href="#garage" data-nav="garage"><span data-icon="garage"></span>차량 보관함<span class="nav-count" id="garageCount">0</span></a>
        <a href="#lookup" data-nav="lookup"><span data-icon="search"></span>매물 확인</a>
        <a href="#dealers" data-nav="dealers"><span data-icon="user"></span>딜러 관리<span class="nav-count" id="dealerCount">0</span></a>
      </nav>
    </aside>
    <div class="workspace">
      <header class="topbar"><span id="breadcrumb">차량 보관함</span><span class="account"><span class="private-label"><span data-icon="lock"></span><span id="accountEmail">개인 보관함</span></span><button class="button quiet small" data-action="logout">로그아웃</button></span></header>
      <div id="connectionError" class="connection-error" role="alert" hidden></div>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dealerDialog" aria-labelledby="dialogTitle">
    <form id="dealerDialogForm">
      <div class="dialog-heading"><h2 id="dialogTitle"></h2><button type="button" class="icon-button" id="closeDialog" aria-label="닫기">×</button></div>
      <div id="dialogBody"></div>
      <p id="dialogError" class="error-text" role="alert"></p>
      <div class="dialog-actions"><button type="button" class="button secondary" id="cancelDialog">취소</button><button type="submit" class="button primary" id="dialogSubmit">저장</button></div>
    </form>
  </dialog>
</body>
</html>
